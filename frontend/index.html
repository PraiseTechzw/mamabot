<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MamaBot local chat</title><link rel="stylesheet" href="/static/css/style.css"></head><body><main class="shell"><header><p class="eyebrow">Maternal health information</p><h1>MamaBot</h1><p>Ask about nutrition, danger signs, appointments, language, or speaking to a nurse.</p></header><section id="messages" aria-live="polite"></section><form id="chat-form"><label for="message">Your message</label><div class="composer"><input id="message" maxlength="1000" autocomplete="off" required placeholder="Type in English, Shona, or Ndebele"><button>Send</button></div></form><p class="notice">MamaBot does not diagnose. For danger signs or an emergency, seek urgent care at the nearest health facility.</p></main><script src="/static/js/chat.js"></script></body></html>
