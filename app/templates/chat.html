<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MamaBot</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
:root{--blue:#1F4E79;--blue-mid:#2E74B5;--blue-light:#EBF3FB;--pink:#BE185D;--border:#E5E7EB;--text:#111827;--muted:#6B7280;--bg:#F3F4F6;--card:#fff;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;height:100dvh;overflow:hidden;font-family:'Inter',sans-serif;font-size:14px;color:var(--text);-webkit-text-size-adjust:100%;}
body{display:flex;flex-direction:column;background:var(--bg);}
header{flex-shrink:0;background:var(--blue);height:54px;display:flex;align-items:center;padding:0 1rem;gap:10px;box-shadow:0 2px 6px rgba(0,0,0,.25);}
.av-wrap{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.av-wrap i{color:#93C5FD;font-size:1.1rem;}
.h-info{flex:1;}
.h-name{color:#fff;font-weight:700;font-size:.95rem;}
.h-sub{display:flex;align-items:center;gap:5px;margin-top:1px;}
.dot-live{width:7px;height:7px;border-radius:50%;background:#4ADE80;}
.h-sub span{color:rgba(255,255,255,.7);font-size:.7rem;}
.h-btn{background:none;border:none;color:rgba(255,255,255,.7);padding:6px 8px;border-radius:6px;cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:4px;font-family:inherit;font-size:.72rem;font-weight:500;transition:all .15s;}
.h-btn:hover{background:rgba(255,255,255,.12);color:#fff;}
.lang-bar{flex-shrink:0;background:var(--card);border-bottom:1px solid var(--border);padding:.45rem .85rem;display:flex;gap:.4rem;align-items:center;overflow-x:auto;}
.lang-bar::-webkit-scrollbar{display:none;}
.lang-lbl{font-size:.68rem;color:var(--muted);font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:4px;}
.lbtn{padding:4px 11px;border-radius:20px;font-size:.72rem;font-weight:600;border:1.5px solid var(--border);background:transparent;cursor:pointer;color:var(--muted);transition:all .15s;white-space:nowrap;font-family:inherit;}
.lbtn.active{background:var(--blue);color:#fff;border-color:var(--blue);}
.lbtn:hover:not(.active){border-color:var(--blue);color:var(--blue);}
.messages{flex:1;overflow-y:auto;padding:.75rem .85rem;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch;}
.messages::-webkit-scrollbar{width:3px;}
.messages::-webkit-scrollbar-thumb{background:var(--border);}
.quick-wrap{flex-shrink:0;background:var(--card);border-top:1px solid var(--border);padding:.45rem .75rem;overflow-x:auto;display:flex;gap:.4rem;}
.quick-wrap::-webkit-scrollbar{display:none;}
.qbtn{flex-shrink:0;padding:6px 11px;border-radius:18px;font-size:.72rem;font-weight:600;border:1.5px solid var(--blue-mid);color:var(--blue);background:var(--blue-light);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:4px;transition:all .15s;font-family:inherit;}
.qbtn:hover,.qbtn:active{background:var(--blue);color:#fff;border-color:var(--blue);}
.qbtn i{font-size:.7rem;}
.msg-row{display:flex;align-items:flex-end;gap:6px;}
.msg-row.user{flex-direction:row-reverse;}
.msg-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.75rem;}
.msg-av.bot{background:var(--blue);color:#fff;}
.msg-av.user{background:var(--pink);color:#fff;}
.bwrap{display:flex;flex-direction:column;max-width:78%;}
.msg-row.user .bwrap{align-items:flex-end;}
.bubble{padding:.6rem .85rem;border-radius:16px;line-height:1.55;word-break:break-word;white-space:pre-wrap;font-size:.875rem;}
.bubble.bot{background:var(--card);border:1px solid var(--border);border-bottom-left-radius:3px;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.06);}
.bubble.user{background:var(--blue);color:#fff;border-bottom-right-radius:3px;}
.btime{font-size:.65rem;color:var(--muted);margin-top:2px;padding:0 2px;}
.msg-row.user .btime{text-align:right;}
.typing-row{display:flex;align-items:flex-end;gap:6px;}
.typing-bbl{background:var(--card);border:1px solid var(--border);border-radius:16px;border-bottom-left-radius:3px;padding:.6rem .85rem;display:flex;gap:4px;align-items:center;}
.tdot{width:7px;height:7px;border-radius:50%;background:var(--muted);opacity:.5;animation:tb .9s infinite;}
.tdot:nth-child(2){animation-delay:.18s;}.tdot:nth-child(3){animation-delay:.36s;}
@keyframes tb{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-5px);opacity:1;}}
.input-area{flex-shrink:0;background:var(--card);border-top:1px solid var(--border);padding:.55rem .75rem;padding-bottom:calc(.55rem + env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:.5rem;}
textarea{flex:1;resize:none;border:1.5px solid var(--border);border-radius:22px;padding:.55rem .9rem;font-size:.88rem;font-family:inherit;color:var(--text);outline:none;max-height:100px;overflow-y:auto;background:#fff;line-height:1.5;transition:border .15s;}
textarea:focus{border-color:var(--blue-mid);}
.send-btn{width:40px;height:40px;border-radius:50%;background:var(--blue);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s;font-size:.88rem;}
.send-btn:hover{background:var(--blue-mid);}
.send-btn:disabled{background:var(--border);cursor:not-allowed;}
.disclaimer{flex-shrink:0;background:#FEF9C3;text-align:center;padding:.28rem .75rem;padding-bottom:calc(.28rem + env(safe-area-inset-bottom,0px));font-size:.65rem;color:#713F12;border-top:1px solid #FDE68A;}
.suggestions{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
.sug-btn{padding:5px 10px;border-radius:14px;font-size:.72rem;font-weight:500;border:1px solid var(--blue-mid);color:var(--blue);background:#fff;cursor:pointer;font-family:inherit;transition:all .15s;}
.sug-btn:hover{background:var(--blue);color:#fff;}
</style>
</head>
<body>
<header>
  <div class="av-wrap"><i class="fa-solid fa-heart-pulse"></i></div>
  <div class="h-info">
    <div class="h-name">MamaBot</div>
    <div class="h-sub"><div class="dot-live"></div><span>Maternal Health Assistant</span></div>
  </div>

</header>

<div class="lang-bar">
  <span class="lang-lbl"><i class="fa-solid fa-globe"></i></span>
  <button class="lbtn active" id="lbtn-english" onclick="setLang('english',this)">English</button>
  <button class="lbtn" id="lbtn-shona"   onclick="setLang('shona',this)">ChiShona</button>
  <button class="lbtn" id="lbtn-ndebele" onclick="setLang('ndebele',this)">IsiNdebele</button>
</div>

<div class="messages" id="messages"></div>
<div class="quick-wrap" id="quick-wrap"></div>

<div class="input-area">
  <textarea id="input" rows="1" placeholder="Type a message or ask a question..."
    onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
  <button class="send-btn" id="send-btn" onclick="sendInput()">
    <i class="fa-solid fa-paper-plane"></i>
  </button>
</div>

<div class="disclaimer">
  <i class="fa-solid fa-circle-exclamation"></i>
  General information only — not medical diagnosis. Emergency: call <strong>994</strong>
</div>

<script>
let lang='english', sessionId='web-'+Math.random().toString(36).slice(2,10), busy=false;

const PH={english:'Type a message or ask a question...',shona:'Nyora mharidzo kana mubvunzo wako...',ndebele:'Bhala umlayezo noma umbuzo wakho...'};

const QR={
  english:[
    {label:'Pregnancy stages',  value:'1',icon:'fa-baby'},
    {label:'Danger signs',      value:'2',icon:'fa-triangle-exclamation'},
    {label:'Nutrition',         value:'3',icon:'fa-apple-whole'},
    {label:'Clinic visits',     value:'4',icon:'fa-hospital'},
    {label:'Labour & delivery', value:'5',icon:'fa-person-pregnant'},
    {label:'Newborn care',      value:'6',icon:'fa-baby-carriage'},
    {label:'HIV & PMTCT',       value:'7',icon:'fa-ribbon'},
  ],
  shona:[
    {label:'Matanho emimba',          value:'1',icon:'fa-baby'},
    {label:'Zviratidzo zvengozi',     value:'2',icon:'fa-triangle-exclamation'},
    {label:'Chikafu chakanaka',       value:'3',icon:'fa-apple-whole'},
    {label:'Kuenda kuchipatara',      value:'4',icon:'fa-hospital'},
    {label:'Kubereka',                value:'5',icon:'fa-person-pregnant'},
    {label:'Kuchengeta mwana mutsva', value:'6',icon:'fa-baby-carriage'},
    {label:'HIV nePMTCT',             value:'7',icon:'fa-ribbon'},
  ],
  ndebele:[
    {label:'Izigaba zokukhulelwa',      value:'1',icon:'fa-baby'},
    {label:'Izibonakaliso zengozi',     value:'2',icon:'fa-triangle-exclamation'},
    {label:'Ukudla okuhle',             value:'3',icon:'fa-apple-whole'},
    {label:'Ukuyabona udokotela',       value:'4',icon:'fa-hospital'},
    {label:'Ukuzala',                   value:'5',icon:'fa-person-pregnant'},
    {label:'Ukunakekela ingane entsha', value:'6',icon:'fa-baby-carriage'},
    {label:'I-HIV le-PMTCT',            value:'7',icon:'fa-ribbon'},
  ],
};

const SUGS={
  pregnancy_stages:{english:['Tell me about danger signs','What should I eat?','When do I go to clinic?'],shona:['Ndiudze nezve zviratidzo zvengozi','Ndinofanira kudya chii?','Ndinoenda riini kuchipatara?'],ndebele:['Ngitshele ngezibonakaliso zengozi','Kumele ngidle ini?','Ngithe nini esibhedlela?']},
  danger_signs:{english:['What should I do now?','Call a nurse','Go to clinic'],shona:['Ndinofanira kuitei iye zvino?','Fonai nesi','Enda kuchipatara'],ndebele:['Kumele ngenzeni manje?','Shayela umeluleki','Ya esibhedlela']},
  nutrition:{english:['About breastfeeding','Foods to avoid','Iron tablets info'],shona:['Nezve kuchengeta mazamu','Chikafu chinofanira kuziviswa','Mapiritsi esimbi'],ndebele:['Ngokuncelisa','Ukudla okufanele ukuphepha','Amaphilisi esibili']},
  clinic_visits:{english:['Find nearest clinic','What to bring?','ANC schedule'],shona:['Tsvaga chipatara chiri pedyo','Ndinofanira kuenda nacho chii?','Chirongwa cheANC'],ndebele:['Thola isibhedlela esiseduze','Kumele ngihambe lenani?','Uhlelo lwe-ANC']},
  labour_delivery:{english:['Signs of labour','When to go to hospital','What to pack'],shona:['Zviratidzo zvekubereka','Ndeienda riini kuchipatara','Zvokupereka'],ndebele:['Izibonakaliso zokuzala','Ngiye nini esibhedlela','Okufanele ukuphatha']},
  newborn_care:{english:['Vaccination schedule','Cord care','Breastfeeding tips'],shona:['Chirongwa chemabindu','Kuchengeta tombo','Mazano ekuchengeta mazamu'],ndebele:['Uhlelo lwemijovo','Ukunakekela intambo','Amacebo okuncelisa']},
  hiv_pmtct:{english:['Can I breastfeed with HIV?','About ART treatment','Baby testing schedule'],shona:['Ndinogona kuchengeta mazamu ndeHIV?','Nezve mushonga weART','Chirongwa chebvunzo yamwana'],ndebele:['Ngingancelisa ngine HIV?','Nge-ART','Uhlelo lokuhlolwa kwengane']},
};

function renderQR(items){
  document.getElementById('quick-wrap').innerHTML=(items||[]).map(it=>
    `<button class="qbtn" onclick="send('${it.value}')"><i class="fa-solid ${it.icon||'fa-circle-dot'}"></i> ${it.label}</button>`
  ).join('');
}

function setLang(l,el){
  lang=l;
  document.querySelectorAll('.lbtn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('input').placeholder=PH[l]||PH.english;
  renderQR(QR[l]||QR.english);
  fetchBot(l,true);
}

function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,100)+'px';}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendInput();}}
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function botFmt(t){return esc(t).replace(/\*(.*?)\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');}

function addBubble(text,role,sugs){
  const msgs=document.getElementById('messages');
  const isU=role==='user';
  const time=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  let sugHtml='';
  if(!isU&&sugs&&sugs.length){
    sugHtml=`<div class="suggestions">${sugs.map(s=>`<button class="sug-btn" onclick="send(${JSON.stringify(s)})">${esc(s)}</button>`).join('')}</div>`;
  }
  const row=document.createElement('div');
  row.className='msg-row '+(isU?'user':'bot');
  row.innerHTML=`
    <div class="msg-av ${isU?'user':'bot'}"><i class="fa-solid ${isU?'fa-user':'fa-heart-pulse'}"></i></div>
    <div class="bwrap">
      <div class="bubble ${isU?'user':'bot'}">${isU?esc(text):botFmt(text)}</div>
      ${sugHtml}
      <div class="btime">${time}</div>
    </div>`;
  msgs.appendChild(row);
  msgs.scrollTop=msgs.scrollHeight;
}

function showTyping(){
  const msgs=document.getElementById('messages');
  const row=document.createElement('div');
  row.id='typing';row.className='typing-row';
  row.innerHTML=`<div class="msg-av bot"><i class="fa-solid fa-heart-pulse"></i></div><div class="typing-bbl"><div class="tdot"></div><div class="tdot"></div><div class="tdot"></div></div>`;
  msgs.appendChild(row);msgs.scrollTop=msgs.scrollHeight;
}
function hideTyping(){const el=document.getElementById('typing');if(el)el.remove();}

async function fetchBot(message,silent=false){
  try{
    const r=await fetch('/chat/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,session_id:sessionId,language:lang})});
    const d=await r.json();
    if(d.language&&d.language!==lang){
      lang=d.language;
      document.querySelectorAll('.lbtn').forEach(b=>b.classList.remove('active'));
      const btn=document.getElementById('lbtn-'+lang);
      if(btn)btn.classList.add('active');
      document.getElementById('input').placeholder=PH[lang]||PH.english;
    }
    if(d.quick_replies&&d.quick_replies.length){
      const def=QR[lang]||QR.english;
      renderQR(d.quick_replies.map(sr=>{const m=def.find(di=>di.value===sr.value);return m?{...sr,icon:m.icon}:{...sr,icon:'fa-circle-dot'};}));
    }
    return d;
  }catch(e){return{response:'Connection error. Please check your internet and try again.'};}
}

async function send(text,showUser=true){
  if(!text.trim()||busy)return;
  busy=true;document.getElementById('send-btn').disabled=true;
  if(showUser)addBubble(text,'user');
  showTyping();
  const d=await fetchBot(text);
  hideTyping();
  const sugs=(SUGS[d.intent]||{})[lang]||[];
  addBubble(d.response||'Sorry, something went wrong.','bot',sugs);
  busy=false;document.getElementById('send-btn').disabled=false;
  document.getElementById('input').focus();
}

function sendInput(){
  const inp=document.getElementById('input');
  const text=inp.value.trim();
  if(!text)return;
  inp.value='';inp.style.height='auto';
  send(text);
}

renderQR(QR.english);
setTimeout(()=>{
  addBubble('Hello! I am MamaBot, your maternal health assistant.\n\nI can help you with pregnancy advice in English, ChiShona or IsiNdebele.\n\nTap a topic below or type your question.','bot',null);
},300);
</script>
</body>
</html>
